<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <radialGradient id="bg" cx=".75" cy=".2" r="1"><stop offset="0" stop-color="#4a4a78"/><stop offset=".55" stop-color="#2a2a3a"/><stop offset="1" stop-color="#1c1c24"/></radialGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a88a9b"/><stop offset="1" stop-color="#6f5464"/></linearGradient>
    <linearGradient id="scarf2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d6070"/><stop offset="1" stop-color="#5a4251"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efd0b9"/><stop offset="1" stop-color="#ddb196"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a3c2c"/><stop offset="1" stop-color="#3a271d"/></linearGradient>
    <clipPath id="c"><circle cx="120" cy="120" r="120"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="240" height="240" fill="url(#bg)"/>
    <!-- body / shoulders under scarf -->
    <path d="M20 240c6-44 40-66 100-68 60 2 94 24 100 68z" fill="#24242f"/>
    <!-- back scarf volume -->
    <path d="M70 104c0-40 22-66 52-66 32 0 54 26 54 64 0 26-6 46-14 60 22 10 40 30 46 78H40c4-40 18-62 40-74-6-16-10-36-10-62z" fill="url(#scarf)"/>
