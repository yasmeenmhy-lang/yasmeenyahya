    <!-- face -->
    <path d="M90 106c0-24 13-40 30-40s30 16 30 40c0 26-14 44-30 44s-30-18-30-44z" fill="url(#skin)"/>
    <!-- side-swept hair under scarf -->
    <path d="M88 108c-2-30 14-48 36-48 16 0 28 9 32 22-10-7-24-9-36-4-14 6-24 16-32 30z" fill="url(#hair)"/>
    <path d="M88 104c-3 18-1 34 6 46-9-5-14-16-14-28 0-8 3-14 8-18z" fill="url(#hair)"/>
    <!-- scarf framing edge over head -->
    <path d="M78 110c-2-42 20-66 44-66 26 0 46 22 46 60l6 4c2-46-22-74-52-74S68 58 70 106z" fill="#b89aab" opacity=".55"/>
    <!-- front drape across chest -->
    <path d="M96 156c10 12 20 18 28 18 14 0 28-12 40-30 6 34-6 70-26 96h-44c-8-26-8-58 2-84z" fill="url(#scarf2)"/>
    <path d="M150 150c10 22 8 58-8 90h14c14-34 14-66 2-94z" fill="#4e3846" opacity=".7"/>
  </g>
</svg>
